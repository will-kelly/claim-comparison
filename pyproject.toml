[project]
name = "claimcheck"
version = "0.1.0"
description = "Review content against an approved claims library for contradictions, unsupported promises, and positioning drift."
requires-python = ">=3.11"
dependencies = ["anthropic>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
claimcheck = "claimcheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["claimcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
